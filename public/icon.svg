<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep layered look replicating the rich blue background in your uploaded image -->
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a7e3" />
      <stop offset="60%" stop-color="#008dd2" />
      <stop offset="100%" stop-color="#0077b8" />
    </linearGradient>
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e3192" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1b1464" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Circular background frame with a rich, glossy 3D shadow offset -->
  <g>
    <!-- Bottom layer dark accent border -->
    <circle cx="260" cy="260" r="236" fill="url(#shadowGrad)" />
    
    <!-- Main vibrant blue circular background -->
    <circle cx="250" cy="250" r="236" fill="url(#circleGrad)" />

    <!-- Styled circular 3D overlays mimicking the original emblem's sweeping lines -->
